<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FenixIn | Under Maintenance</title>
<meta name="description" content="FenixIn is under maintenance and will be back soon.">
<meta name="theme-color" content="#0b0a10">
<style>
  :root { --ember:#ff7a1a; --gold:#ffc46b; --ink:#f4efe6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; overflow:hidden; background:#0b0a10; }
  body {
    background:
      radial-gradient(ellipse at 50% 110%, #3a1406 0%, rgba(58,20,6,0) 55%),
      radial-gradient(ellipse at 50% 0%, #1a1530 0%, #0b0a10 70%);
    color:var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .content {
    position:fixed; inset:0; z-index:2; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .brand {
    letter-spacing:.55em; font-weight:600; font-size:clamp(12px,1.6vw,15px);
    color:var(--gold); margin-bottom:22px; padding-left:.55em;
    text-shadow:0 0 18px rgba(255,140,40,.55);
  }
  h1 {
    font-weight:700; line-height:1.05; letter-spacing:-.02em;
    font-size:clamp(34px,7vw,84px);
    background:linear-gradient(180deg,#fff6e6 0%,#ffc46b 55%,#ff7a1a 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 4px 30px rgba(255,110,20,.35));
  }
  p.sub {
    margin-top:20px; max-width:520px; font-size:clamp(15px,2vw,19px);
    line-height:1.55; color:rgba(244,239,230,.72);
  }
  .pulse {
    margin-top:28px; display:inline-flex; align-items:center; gap:10px;
    font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:rgba(244,239,230,.6);
  }
  .pulse i {
    width:8px; height:8px; border-radius:50%; background:var(--ember);
    box-shadow:0 0 0 0 rgba(255,122,26,.7); animation:pulse 1.8s infinite;
  }
  @keyframes pulse {
    0% { box-shadow:0 0 0 0 rgba(255,122,26,.7); }
    70% { box-shadow:0 0 0 14px rgba(255,122,26,0); }
    100% { box-shadow:0 0 0 0 rgba(255,122,26,0); }
  }
  .hint {
    position:fixed; bottom:18px; left:0; right:0; z-index:2; text-align:center;
    font-size:12px; letter-spacing:.08em; color:rgba(244,239,230,.38);
    pointer-events:none; transition:opacity .8s;
  }
  .hint.gone { opacity:0; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<main class="content">
  <div class="brand">FENIXIN</div>
  <h1>We're under<br>maintenance</h1>
  <p class="sub">Something better is rising from the ashes. We'll be back soon.</p>
  <div class="pulse"><i></i> Back shortly</div>
</main>

<div class="hint" id="hint">Move your cursor &middot; right-click (or long-press) to light a bird</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const BIRD_COUNT = 8;
  let W = 0, H = 0, DPR = 1;

  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Pointer
  const mouse = { x: W / 2, y: H / 2 };
  let lastIgnite = 0;

  // Entities
  const birds = [], fire = [], ash = [], embers = [];

  function makeBird(x, y, entering) {
    return {
      x, y,
      vx: rand(-1, 1), vy: entering ? -rand(6, 9) : rand(-1, 1),
      size: rand(9, 15),
      phase: rand(0, 6.28), ang: rand(0, 6.28), rad: rand(60, 170), wob: rand(0, 6.28),
      wobSpeed: rand(0.006, 0.014),
      face: 1, state: 'alive', burn: 0,
      tone: rand(0.88, 1)
    };
  }

  for (let i = 0; i < BIRD_COUNT; i++) {
    birds.push(makeBird(rand(0, W), rand(H * 0.3, H), false));
  }
  for (let i = 0; i < 45; i++) {
    embers.push({ x: rand(0, W), y: rand(0, H), vy: rand(0.15, 0.6), r: rand(0.6, 2), a: rand(0.1, 0.5), s: rand(0, 6.28) });
  }

  // Ignite nearest living bird
  function ignite() {
    const now = performance.now();
    if (now - lastIgnite < 300) return;
    lastIgnite = now;
    let best = null, bd = Infinity;
    for (const b of birds) {
      if (b.state !== 'alive') continue;
      const d = (b.x - mouse.x) ** 2 + (b.y - mouse.y) ** 2;
      if (d < bd) { bd = d; best = b; }
    }
    if (best) {
      best.state = 'burning';
      best.burn = 0;
      hint.classList.add('gone');
    }
  }

  function turnToAsh(b) {
    const n = 46;
    for (let i = 0; i < n; i++) {
      ash.push({
        x: b.x + rand(-b.size, b.size), y: b.y + rand(-b.size * .6, b.size * .6),
        vx: rand(-1.2, 1.2), vy: rand(-1.6, 0.2),
        life: 0, max: rand(120, 260), size: rand(1.2, 3.6), sway: rand(0, 6.28),
        glow: Math.random() < 0.25
      });
    }
    const i = birds.indexOf(b);
    if (i > -1) birds.splice(i, 1);
    // New bird arrives from the bottom of the screen
    setTimeout(() => {
      birds.push(makeBird(rand(W * 0.1, W * 0.9), H + 40, true));
    }, 450);
  }

  // Events
  window.addEventListener('contextmenu', e => { e.preventDefault(); mouse.x = e.clientX; mouse.y = e.clientY; ignite(); });

  let pressTimer = null, pressX = 0, pressY = 0;
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (pressTimer && Math.hypot(e.clientX - pressX, e.clientY - pressY) > 14) {
      clearTimeout(pressTimer); pressTimer = null;
    }
  });
  window.addEventListener('pointerdown', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    if (e.pointerType === 'touch') {
      pressX = e.clientX; pressY = e.clientY;
      pressTimer = setTimeout(ignite, 450);
    }
  });
  const endPress = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
  window.addEventListener('pointerup', endPress);
  window.addEventListener('pointercancel', endPress);

  // Update
  function update(dt) {
    for (const b of birds) {
      if (b.state === 'alive') {
        b.wob += b.wobSpeed * dt;
        const tx = mouse.x + Math.cos(b.ang + b.wob) * b.rad;
        const ty = mouse.y + Math.sin(b.ang + b.wob * 1.3) * b.rad * 0.7;
        b.vx += (tx - b.x) * 0.0035 * dt;
        b.vy += (ty - b.y) * 0.0035 * dt;
        // separation
        for (const o of birds) {
          if (o === b) continue;
          const dx = b.x - o.x, dy = b.y - o.y, d2 = dx * dx + dy * dy;
          if (d2 > 0 && d2 < 900) { const d = Math.sqrt(d2); b.vx += dx / d * 0.15 * dt; b.vy += dy / d * 0.15 * dt; }
        }
        const damp = Math.pow(0.965, dt);
        b.vx *= damp; b.vy *= damp;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 9) { b.vx *= 9 / sp; b.vy *= 9 / sp; }
        b.phase += (0.2 + sp * 0.025) * dt;
      } else { // burning: panic and sink
        b.burn += dt / 95;
        b.vx += (Math.random() - 0.5) * 1.1 * dt;
        b.vy += 0.12 * dt;
        b.vx *= Math.pow(0.95, dt); b.vy *= Math.pow(0.95, dt);
        b.phase += 0.7 * dt;
        for (let i = 0; i < 3; i++) {
          fire.push({
            x: b.x + rand(-b.size, b.size), y: b.y + rand(-b.size * .6, b.size * .4),
            vx: rand(-0.6, 0.6), vy: rand(-2.6, -0.8),
            life: 0, max: rand(22, 44), size: rand(b.size * 0.35, b.size * 0.8)
          });
        }
        if (b.burn >= 1) { turnToAsh(b); continue; }
      }
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (Math.abs(b.vx) > 0.4) b.face = b.vx > 0 ? 1 : -1;
    }

    for (let i = fire.length - 1; i >= 0; i--) {
      const p = fire[i];
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx += rand(-0.08, 0.08);
      if (p.life >= p.max) fire.splice(i, 1);
    }
    for (let i = ash.length - 1; i >= 0; i--) {
      const p = ash[i];
      p.life += dt; p.sway += 0.05 * dt;
      p.vy += 0.012 * dt; p.vx *= Math.pow(0.985, dt); p.vy *= Math.pow(0.99, dt);
      p.x += (p.vx + Math.sin(p.sway) * 0.35) * dt; p.y += p.vy * dt;
      if (p.life >= p.max) ash.splice(i, 1);
    }
    for (const e of embers) {
      e.y -= e.vy * dt; e.s += 0.02 * dt; e.x += Math.sin(e.s) * 0.25 * dt;
      if (e.y < -10) { e.y = H + 10; e.x = rand(0, W); }
    }
  }

  // Draw
  function drawBird(b) {
    const s = b.size, f = Math.sin(b.phase);
    const burning = b.state === 'burning';
    const t = burning ? clamp(b.burn, 0, 1) : 0;
    const base = 238 * b.tone;
    const r = Math.round(lerp(base, 28, t));
    const g = Math.round(lerp(base * 0.96, 22, t));
    const bl = Math.round(lerp(base * 0.9, 20, t));
    const body = `rgb(${r},${g},${bl})`;
    const wing = `rgb(${Math.round(r * 0.8)},${Math.round(g * 0.8)},${Math.round(bl * 0.82)})`;

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.face, 1);
    ctx.rotate(clamp(b.vy * 0.04, -0.5, 0.5));

    // tail
    ctx.fillStyle = wing;
    ctx.beginPath();
    ctx.moveTo(-s * 0.7, -s * 0.05); ctx.lineTo(-s * 1.8, -s * 0.35); ctx.lineTo(-s * 1.65, s * 0.2);
    ctx.closePath(); ctx.fill();
    // body
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.45, 0, 0, 6.2832); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(s * 0.85, -s * 0.15, s * 0.33, 0, 6.2832); ctx.fill();
    // beak
    ctx.fillStyle = burning ? `rgb(${Math.round(lerp(255, 40, t))},${Math.round(lerp(150, 25, t))},30)` : '#ff9a3c';
    ctx.beginPath();
    ctx.moveTo(s * 1.1, -s * 0.25); ctx.lineTo(s * 1.55, -s * 0.1); ctx.lineTo(s * 1.1, -s * 0.02);
    ctx.closePath(); ctx.fill();
    // eye
    ctx.fillStyle = '#15110f';
    ctx.beginPath(); ctx.arc(s * 0.95, -s * 0.2, s * 0.07, 0, 6.2832); ctx.fill();
    // wing
    const tipY = -s * 1.7 * f;
    ctx.fillStyle = wing;
    ctx.beginPath();
    ctx.moveTo(s * 0.5, -s * 0.05);
    ctx.quadraticCurveTo(s * 0.05, tipY * 1.05, -s * 1.0, tipY * 0.85);
    ctx.quadraticCurveTo(-s * 0.4, tipY * 0.2, -s * 0.5, s * 0.05);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min((now - (frame.last || now)) / 16.667, 3);
    frame.last = now;
    update(dt);

    ctx.clearRect(0, 0, W, H);

    // ambient embers
    ctx.globalCompositeOperation = 'lighter';
    for (const e of embers) {
      ctx.fillStyle = `rgba(255,140,50,${e.a * (0.6 + 0.4 * Math.sin(e.s * 3))})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // glow under burning birds
    ctx.globalCompositeOperation = 'lighter';
    for (const b of birds) {
      if (b.state !== 'burning') continue;
      const rr = b.size * 4;
      const gr = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rr);
      gr.addColorStop(0, 'rgba(255,140,40,0.45)'); gr.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    for (const b of birds) drawBird(b);

    // fire
    ctx.globalCompositeOperation = 'lighter';
    for (const p of fire) {
      const k = p.life / p.max, sz = p.size * (1 - k * 0.7);
      const col = k < 0.35 ? `rgba(255,${Math.round(lerp(230, 170, k / 0.35))},80,${0.85 - k * 0.5})`
                : k < 0.7 ? `rgba(255,${Math.round(lerp(150, 70, (k - 0.35) / 0.35))},20,${0.7 - k * 0.5})`
                : `rgba(120,30,10,${Math.max(0, 0.45 - k * 0.45)})`;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, 6.2832); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    // ashes
    for (const p of ash) {
      const k = p.life / p.max, a = (1 - k) * 0.85;
      if (p.glow && k < 0.4) {
        ctx.fillStyle = `rgba(255,120,30,${(0.4 - k) * 1.6})`;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.4, 0, 6.2832); ctx.fill();
      }
      ctx.fillStyle = `rgba(150,144,138,${a})`;
      ctx.fillRect(p.x, p.y, p.size, p.size * 0.8);
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
